# Juneau Odenwald Roofing (joiroofing.com): Netlify settings.
# Every push to the main branch rebuilds and publishes the site.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  # Set in Netlify (Site configuration > Environment variables), never here:
  #   SITE_LIVE=true   ONLY once joiroofing.com points at Netlify: turns on tracking (GTM, GA4, Ads, Meta Pixel)
  #                    and lets Google index the site. Without it the preview is hidden from search.

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------- Redirects ----------
